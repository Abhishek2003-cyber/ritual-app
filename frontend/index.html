<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritual Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.14.0/dist/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F7F5;
    --surface: #EFEFEC;
    --card: #FFFFFF;
    --border: rgba(0,0,0,0.10);
    --border-md: rgba(0,0,0,0.18);
    --text: #1A1A18;
    --muted: #6B6B67;
    --hint: #A0A09C;
    --accent: #534AB7;
    --accent-bg: #EEEDFE;
    --accent-border: #AFA9EC;
    --accent-hover: #3C3489;
    --success-bg: #E1F5EE;
    --success-text: #0F6E56;
    --success-border: #9FE1CB;
    --error-bg: #FCEBEB;
    --error-text: #A32D2D;
    --green-dot: #1D9E75;
    --radius-lg: 14px;
    --radius-md: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413;
      --surface: #1E1E1C;
      --card: #252523;
      --border: rgba(255,255,255,0.08);
      --border-md: rgba(255,255,255,0.14);
      --text: #F0F0EC;
      --muted: #A0A09C;
      --hint: #5C5C58;
      --accent: #7F77DD;
      --accent-bg: #26215C;
      --accent-border: #534AB7;
      --accent-hover: #AFA9EC;
      --success-bg: #04342C;
      --success-text: #9FE1CB;
      --success-border: #085041;
      --error-bg: #501313;
      --error-text: #F09595;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .page { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }

  /* Top bar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-icon {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--accent-bg); display: flex; align-items: center; justify-content: center;
  }
  .brand-icon i { font-size: 20px; color: var(--accent); }
  .brand-name { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .brand-sub { font-size: 12px; color: var(--hint); }

  .topbar-right { display: flex; align-items: center; gap: 10px; }

  .chain-badge {
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px; border-radius: 20px;
    border: 1px solid var(--border-md);
    background: var(--card); font-size: 12px; color: var(--muted);
  }
  .chain-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-dot); flex-shrink: 0; }

  .connect-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 18px; border-radius: var(--radius-md);
    border: 1px solid var(--border-md); background: var(--card);
    color: var(--text); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
    font-family: 'Inter', sans-serif;
  }
  .connect-btn:hover { background: var(--surface); }
  .connect-btn.connected { color: var(--success-text); border-color: var(--success-border); background: var(--success-bg); }

  /* Stats */
  .stats-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 32px;
  }
  .stat {
    background: var(--surface); border-radius: var(--radius-md);
    padding: 16px;
  }
  .stat-label { font-size: 11px; color: var(--hint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 500; color: var(--text); }

  /* Section */
  .section { margin-bottom: 32px; }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .section-title { font-size: 12px; font-weight: 500; color: var(--hint); text-transform: uppercase; letter-spacing: 0.06em; }
  .section-hint { font-size: 12px; color: var(--hint); }

  /* Card */
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px;
  }

  /* Form */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 540px) { .form-row { grid-template-columns: 1fr; } }

  .field label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 13px;
    background: var(--surface); border: 1px solid var(--border-md);
    border-radius: var(--radius-md); color: var(--text);
    font-size: 14px; font-family: 'Inter', sans-serif;
    outline: none; transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--accent); }
  .field input::placeholder { color: var(--hint); }

  .pfp-row { display: flex; align-items: center; gap: 8px; }
  .pfp-row input { flex: 1; }
  .pfp-preview {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--border-md); object-fit: cover;
    display: none; flex-shrink: 0;
  }
  .pfp-btn {
    padding: 10px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--border-md); background: var(--surface);
    color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap;
    transition: background 0.15s; font-family: 'Inter', sans-serif;
  }
  .pfp-btn:hover { background: var(--card); color: var(--text); }

  .action-row { display: flex; gap: 10px; margin-top: 16px; align-items: center; }
  .btn-primary {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 22px; border-radius: var(--radius-md);
    background: var(--accent); border: none; color: #fff;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background 0.15s; font-family: 'Inter', sans-serif;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-ghost {
    display: flex; align-items: center; gap: 7px;
    padding: 10px 16px; border-radius: var(--radius-md);
    border: 1px solid var(--border-md); background: transparent;
    color: var(--muted); font-size: 13px; cursor: pointer;
    transition: background 0.15s; font-family: 'Inter', sans-serif;
  }
  .btn-ghost:hover { background: var(--surface); color: var(--text); }

  .status-msg {
    margin-top: 14px; padding: 10px 14px;
    border-radius: var(--radius-md); font-size: 13px;
    background: var(--surface); color: var(--muted); display: none;
  }
  .status-msg.show { display: block; }
  .status-msg.success { background: var(--success-bg); color: var(--success-text); }
  .status-msg.error { background: var(--error-bg); color: var(--error-text); }

  /* Divider */
  .divider { border: none; border-top: 1px solid var(--border); margin: 28px 0; }

  /* Candidates grid */
  .candidates-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .candidate-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 8px;
    transition: border-color 0.15s;
  }
  .candidate-card:hover { border-color: var(--border-md); }

  .cand-avatar {
    width: 60px; height: 60px; border-radius: 50%;
    object-fit: cover; border: 1px solid var(--border);
  }
  .cand-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .cand-wallet {
    font-size: 11px; color: var(--hint);
    font-family: 'JetBrains Mono', monospace;
  }
  .cand-votes { font-size: 22px; font-weight: 500; color: var(--accent); line-height: 1; }
  .cand-votes-label { font-size: 11px; color: var(--hint); margin-top: -4px; }

  .vote-btn {
    width: 100%; padding: 9px 0; border-radius: var(--radius-md);
    border: 1px solid var(--accent-border); background: var(--accent-bg);
    color: var(--accent); font-size: 12px; font-weight: 500; cursor: pointer;
    transition: background 0.15s; margin-top: 6px;
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .vote-btn:hover { background: var(--accent-border); }

  .empty-state {
    grid-column: 1/-1; padding: 40px; text-align: center;
    color: var(--hint); font-size: 13px;
    background: var(--surface); border-radius: var(--radius-lg);
  }
  .empty-state i { font-size: 24px; display: block; margin: 0 auto 10px; }
</style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-bolt"></i></div>
      <div>
        <div class="brand-name">Ritual Vote</div>
        <div class="brand-sub">Decentralized governance</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="chain-badge">
        <div class="chain-dot"></div>
        Ritual · Chain 1979
      </div>
      <button class="connect-btn" id="connect-btn" onclick="connectWallet()">
        <i class="ti ti-wallet"></i>
        Connect wallet
      </button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-label">Candidates</div>
      <div class="stat-value" id="stat-candidates">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total votes</div>
      <div class="stat-value" id="stat-votes">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Network status</div>
      <div class="stat-value" style="font-size:15px; padding-top:6px; color: var(--green-dot);">Online</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <div class="section-title">Register as candidate</div>
    </div>
    <div class="card">
      <div class="form-row">
        <div class="field">
          <label>Your name</label>
          <input type="text" id="regName" placeholder="Enter your name" />
        </div>
        <div class="field">
          <label>X / Twitter username (optional)</label>
          <div class="pfp-row">
            <input type="text" id="regImage" placeholder="@username" />
            <button class="pfp-btn" onclick="previewPfp()">Fetch</button>
            <img class="pfp-preview" id="pfpPreview" />
          </div>
        </div>
      </div>
      <div class="action-row">
        <button class="btn-primary" onclick="registerCandidate()">
          <i class="ti ti-user-plus"></i>
          Register
        </button>
        <button class="btn-ghost" onclick="loadCandidates()">
          <i class="ti ti-refresh"></i>
          Refresh
        </button>
      </div>
      <div class="status-msg" id="regOutput"></div>
    </div>
  </div>

  <hr class="divider" />

  <div class="section">
    <div class="section-header">
      <div class="section-title">Active candidates</div>
      <div class="section-hint">Click vote to cast on-chain</div>
    </div>
    <div class="candidates-grid" id="candidatesGrid">
      <div class="empty-state">
        <i class="ti ti-loader"></i>
        Connecting to blockchain...
      </div>
    </div>
    <div class="status-msg" id="vote-status" style="margin-top:16px"></div>
  </div>

</div>

<script>
const CONTRACT = "0xCbaCc27A0F76Ad8529cA1f11aF261d59B2635ac8";
const RPC = "https://rpc.ritualfoundation.org";
let userAccount = null;

function setStatus(id, msg, type) {
  const el = document.getElementById(id);
  el.className = "status-msg show " + type;
  el.textContent = msg;
}

function previewPfp() {
  let username = document.getElementById("regImage").value.trim().replace("@","");
  if (!username) { setStatus("regOutput","Enter a username first","error"); return; }
  const url = "https://unavatar.io/twitter/" + username;
  const img = document.getElementById("pfpPreview");
  img.style.display = "block";
  img.src = url;
  img.onerror = () => { setStatus("regOutput","Username not found","error"); img.style.display="none"; };
  img.onload = () => setStatus("regOutput","Profile picture loaded — ready to register","success");
}

async function connectWallet() {
  if (!window.ethereum) { alert("MetaMask not found."); return; }
  const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
  userAccount = accounts[0];
  const btn = document.getElementById("connect-btn");
  btn.className = "connect-btn connected";
  btn.innerHTML = '<i class="ti ti-check"></i> ' + userAccount.slice(0,6) + "..." + userAccount.slice(-4);
  setStatus("regOutput","Wallet connected — you can register now","success");
  loadCandidates();
}

async function rpcCall(data) {
  const res = await fetch(RPC, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({jsonrpc:"2.0",method:"eth_call",params:[{to:CONTRACT,data},"latest"],id:1})
  });
  return (await res.json()).result;
}

function encodeUint(n) { return n.toString(16).padStart(64,"0"); }

function decodeStr(hex, slotIndex) {
  const clean = hex.startsWith("0x") ? hex.slice(2) : hex;
  const offset = parseInt(clean.slice(slotIndex*64, slotIndex*64+64),16)*2;
  const len = parseInt(clean.slice(offset, offset+64),16)*2;
  const strHex = clean.slice(offset+64, offset+64+len);
  let str = "";
  for (let i=0; i<strHex.length; i+=2) str += String.fromCharCode(parseInt(strHex.substr(i,2),16));
  return str;
}

function encodeAbiString(str) {
  const len = encodeUint(str.length);
  let hex = "";
  for (let i=0;i<str.length;i++) hex += str.charCodeAt(i).toString(16).padStart(2,"0");
  while (hex.length%64!==0) hex += "00";
  return len+hex;
}

async function getCandidateCount() {
  const res = await rpcCall("0x30a56347");
  return parseInt(res,16);
}

async function getCandidate(i) {
  const res = await rpcCall("0x35b8e820" + encodeUint(i));
  const clean = res.slice(2);
  const name = decodeStr(res,0);
  const wallet = "0x"+clean.slice(64+24, 64+64);
  const imageUrl = decodeStr(res,2);
  const voteCount = parseInt(clean.slice(192,256),16);
  return { name, wallet, imageUrl, voteCount };
}

async function loadCandidates() {
  const grid = document.getElementById("candidatesGrid");
  grid.innerHTML = '<div class="empty-state"><i class="ti ti-loader"></i>Loading from blockchain...</div>';
  try {
    const count = await getCandidateCount();
    document.getElementById("stat-candidates").textContent = count;
    if (count === 0) {
      grid.innerHTML = '<div class="empty-state"><i class="ti ti-users"></i>No candidates yet — be the first to register.</div>';
      document.getElementById("stat-votes").textContent = "0";
      return;
    }
    grid.innerHTML = "";
    let totalVotes = 0;
    for (let i=0;i<count;i++) {
      const c = await getCandidate(i);
      totalVotes += c.voteCount;
      const imgSrc = c.imageUrl || "https://api.dicebear.com/7.x/identicon/svg?seed="+c.wallet;
      const short = c.wallet.slice(0,6)+"..."+c.wallet.slice(-4);
      const el = document.createElement("div");
      el.className = "candidate-card";
      el.innerHTML = `
        <img class="cand-avatar" src="${imgSrc}" onerror="this.src='https://api.dicebear.com/7.x/identicon/svg?seed=${i}'" alt="${c.name}" />
        <div class="cand-name">${c.name}</div>
        <div class="cand-wallet">${short}</div>
        <div class="cand-votes">${c.voteCount}</div>
        <div class="cand-votes-label">votes</div>
        <button class="vote-btn" onclick="vote(${i})">
          <i class="ti ti-bolt"></i> Vote
        </button>`;
      grid.appendChild(el);
    }
    document.getElementById("stat-votes").textContent = totalVotes;
  } catch(e) {
    grid.innerHTML = '<div class="empty-state" style="color:var(--error-text)">Error: ' + e.message + '</div>';
  }
}

async function registerCandidate() {
  if (!userAccount) { setStatus("regOutput","Connect your wallet first","error"); return; }
  const name = document.getElementById("regName").value.trim();
  let imageUrl = document.getElementById("regImage").value.trim();
  if (imageUrl) imageUrl = "https://unavatar.io/twitter/"+imageUrl.replace("@","");
  if (!name) { setStatus("regOutput","Name is required","error"); return; }
  try {
    setStatus("regOutput","Broadcasting to Ritual Network...","");
    const nameEnc = encodeAbiString(name);
    const imgEnc = encodeAbiString(imageUrl);
    const nameOffset = encodeUint(64);
    const imgOffset = encodeUint(64+32+Math.ceil(name.length/32)*32);
    const data = "0x0dbce4dd"+nameOffset+imgOffset+nameEnc+imgEnc;
    const tx = await window.ethereum.request({method:"eth_sendTransaction",params:[{from:userAccount,to:CONTRACT,data}]});
    setStatus("regOutput","Registered — tx: "+tx.slice(0,22)+"...","success");
    setTimeout(loadCandidates, 4000);
  } catch(e) {
    setStatus("regOutput",e.message,"error");
  }
}

async function vote(index) {
  if (!userAccount) { alert("Connect wallet first"); return; }
  try {
    const vs = document.getElementById("vote-status");
    vs.className = "status-msg show";
    vs.textContent = "Submitting vote...";
    const data = "0x0121b93f"+encodeUint(index);
    const tx = await window.ethereum.request({method:"eth_sendTransaction",params:[{from:userAccount,to:CONTRACT,data}]});
    setStatus("vote-status","Vote confirmed — tx: "+tx.slice(0,22)+"...","success");
    setTimeout(loadCandidates, 4000);
  } catch(e) {
    setStatus("vote-status",e.message,"error");
  }
}

loadCandidates();
</script>
</body>
</html>
